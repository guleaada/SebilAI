# fly.toml app configuration file generated for sebilai-3vd29g on 2026-08-09T15:15:09Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'sebilai-3vd29g'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.http_options]
    idle_timeout = 120

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
